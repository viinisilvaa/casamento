<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tire sua foto - Jucemara & César</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="pagina">

        <div class="card">

            <div class="coracao">
                ♡
            </div>

            <p class="frase">
                Nosso grande dia
            </p>

            <h1>
                Jucemara
                <span>&</span>
                César Vinicius
            </h1>

            <div class="linha"></div>

            <p class="mensagem">
                Faça parte das nossas memórias!
            </p>

            <p class="instrucao">
                Tire uma foto e compartilhe
                esse momento especial conosco.
            </p>

            <div class="camera-area">

                <video id="camera"
                       autoplay
                       playsinline>
                </video>

                <canvas id="canvas"></canvas>

            </div>

            <button
                id="tirarFoto"
                class="botao botao-foto">

                📸 Tirar foto

            </button>

            <div
                id="previewContainer"
                class="preview-container">

                <p>
                    Sua foto
                </p>

                <img
                    id="preview"
                    alt="Prévia da foto">

            </div>

            <button
                id="enviarFoto"
                class="botao botao-enviar">

                abrir galeria

            </button>

            <input
                id="galeriaFoto"
                type="file"
                accept="image/*"
                hidden>

            <p
                id="status"
                class="status">
            </p>

            <div class="rodape">

                <span>J</span>
                <span>♡</span>
                <span>C</span>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
