<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotos - Casamento Jucemara & César</title>
    <link rel="stylesheet" href="qr-style.css">
</head>

<body>

    <!-- QR CODE VIEW -->
    <div id="qrView" class="view">
        <div class="qr-container">
            <h1>Compartilhe sua foto!</h1>
            <p class="qr-subtitle">Escaneie o código QR com seu celular</p>
            
            <div id="qrCodeContainer" class="qr-code-box"></div>
            
            <p class="qr-info">
                Ou acesse direto: 
                <a id="directLink" href="#" target="_blank">clique aqui</a>
            </p>
        </div>
    </div>

    <!-- CÂMERA VIEW -->
    <div id="cameraView" class="view hidden">
        <div class="camera-container">
            <button class="btn-back" id="btnBack">← Voltar</button>
            
            <h2>Abra sua câmera</h2>
            
            <div class="camera-wrapper">
                <video id="videoElement" autoplay playsinline></video>
                <canvas id="canvasElement" style="display: none;"></canvas>
            </div>

            <div class="button-group">
                <button id="btnOpenCamera" class="btn btn-primary">
                    📷 Abrir câmera
                </button>
                <button id="btnTakePicture" class="btn btn-secondary" disabled>
                    📸 Tirar foto
                </button>
            </div>

            <p id="statusMessage" class="status-message"></p>
        </div>
    </div>

    <!-- PREVIEW VIEW -->
    <div id="previewView" class="view hidden">
        <div class="preview-container">
            <button class="btn-back" id="btnBackPreview">← Voltar</button>
            
            <h2>Sua foto</h2>
            
            <img id="previewImage" alt="Foto capturada" class="preview-image">

            <div class="button-group">
                <button id="btnRetake" class="btn btn-secondary">
                    🔄 Tirar outra
                </button>
                <button id="btnUpload" class="btn btn-success">
                    💾 Enviar para Drive
                </button>
            </div>

            <p id="uploadStatus" class="status-message"></p>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="qr-script.js"></script>

</body>

</html>
