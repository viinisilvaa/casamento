<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Jucemara & César Vinicius</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="pagina">

        <div class="card">

            <div class="coracao">
                ♡
            </div>

            <p class="frase">
                Nosso grande dia
            </p>

            <h1>
                Jucemara
                <span>&</span>
                César Vinicius
            </h1>

            <div class="linha"></div>

            <p class="mensagem">
                Faça parte das nossas memórias!
            </p>

            <p class="instrucao">
                Tire uma foto e compartilhe
                esse momento especial conosco.
            </p>

            <div id="qrContainer" 
                 class="qr-container"
                 style="display: none;">
                
                <div id="qrCode" 
                     class="qr-code-box">
                </div>

                <p class="qr-info">
                    Ou acesse direto: 
                    <a id="directLink" 
                       href="#" 
                       target="_blank">clique aqui</a>
                </p>

            </div>

            <div class="camera-area">

                <video id="camera"
                       autoplay
                       playsinline>
                </video>

                <canvas id="canvas"></canvas>

            </div>

            <button
                id="abrirCamera"
                class="botao botao-camera">

                📷 Abrir câmera

            </button>

            <button
                id="tirarFoto"
                class="botao botao-foto"
                disabled>

                📸 Tirar foto

            </button>

            <div
                id="previewContainer"
                class="preview-container">

                <p>
                    Sua foto
                </p>

                <img
                    id="preview"
                    alt="Prévia da foto">

            </div>

            <button
                id="enviarFoto"
                class="botao botao-enviar"
                disabled>

                💕 Compartilhar foto

            </button>

            <p
                id="status"
                class="status">
            </p>

            <div class="rodape">

                <span>J</span>
                <span>♡</span>
                <span>C</span>

            </div>

        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="script.js"></script>

</body>

</html>
